[package]
name = "daylog"
version = "0.1.0"
description = "Privacy-respecting personal activity logger — tracks which apps and windows you use and for how long. No keystroke capture."
authors = ["Ninad K"]
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/ninad-k/daylog"

[lib]
name = "daylog_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
directories = "5"

# Active-window detection (title + app name). Deliberately NO keyboard capture:
# daylog records WHICH app/window you used and for how long, never WHAT you typed.
active-win-pos-rs = "0.8"

# Optional at-rest encryption of the log store.
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
zeroize = "1"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"

[features]
# default production build
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
