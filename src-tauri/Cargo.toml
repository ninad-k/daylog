[package]
name = "daylog"
version = "0.2.2"
description = "Personal activity logger with local analytics, encrypted storage, and optional per-app text recording on Windows."
authors = ["Ninad K"]
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/ninad-k/daylog"

[lib]
name = "daylog_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
directories = "5"

# Active-window detection; optional Windows text recording is isolated in capture/typing.
active-win-pos-rs = "0.8"

# Optional at-rest encryption of the log store.
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_System_Com", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_Variant", "Win32_Globalization"] }

[features]
# default production build
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
